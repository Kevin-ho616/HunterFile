<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><style>:root{color-scheme:light dark}body{font:14px -apple-system,sans-serif;padding:36px}h1{font-size:27px}p{color:#888}button{padding:10px 18px;border-radius:8px;background:#6477db;color:white;border:0;cursor:pointer}table{width:100%;margin-top:24px;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #8883}#stats{display:flex;gap:28px;margin:28px 0;font-size:23px}.small{font-size:12px;color:#888}</style></head><body><p>OPENEAGLE PLUGIN</p><h1>素材统计与清单导出</h1><p>在主窗口中选择素材后点击刷新，可以导出带标签、来源与评分的 CSV 清单。</p><button id="refresh">刷新所选素材</button> <button id="export">导出 CSV</button><div id="stats"></div><table><thead><tr><th>名称</th><th>类型</th><th>标签</th><th>评分</th></tr></thead><tbody id="rows"></tbody></table><p id="status"></p><script>
let items=[];
async function refresh(){items=await openeagle.getSelection();document.getElementById('stats').textContent=`${items.length} 个素材 · ${(items.reduce((n,i)=>n+i.byteCount,0)/1048576).toFixed(1)} MB`;const rows=document.getElementById('rows');rows.replaceChildren();for(const item of items){const row=document.createElement('tr');for(const value of [item.name,item.ext,item.tags.join(', '),'★'.repeat(item.rating)]){const cell=document.createElement('td');cell.textContent=value;row.append(cell)}rows.append(row)}}
document.getElementById('refresh').onclick=refresh;
document.getElementById('export').onclick=async()=>{const cell=value=>'"'+String(value).replaceAll('"','""').replace(/^[=+\-@]/,"'$&")+'"';const rows=[['名称','类型','标签','评分','来源','备注'],...items.map(i=>[i.name,i.ext,i.tags.join(', '),i.rating,i.sourceURL,i.note])];const saved=await openeagle.saveText('OpenEagle-素材清单.csv','\ufeff'+rows.map(row=>row.map(cell).join(',')).join('\r\n'));document.getElementById('status').textContent=saved?'已导出。':'已取消。'};refresh();
</script></body></html>
