<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><title>HunterFiles 采集设置</title></head><body class="options"><header><img class="mark" src="icons/hunterfiles-128.png" alt=""><div><strong>连接 HunterFiles</strong><small>本机浏览器采集</small></div></header><main><p>在 HunterFiles → 设置 → 扩展中启用本地采集 API，复制采集令牌后粘贴到这里。</p><label>采集令牌<input type="password" id="token" autocomplete="off"></label><button class="primary" id="save">保存并测试连接</button><p id="status" role="status"></p><p class="muted">令牌保存在本机浏览器扩展存储，不上传到云端。服务固定为 127.0.0.1:41596。</p></main><script type="module" src="options.js"></script></body></html>
